
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ordermind"
version = "0.1.0"
description = "A tool-using AI agent for delivery order support analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "pydantic>=2.9",
    "pydantic-settings",
    "langchain",
    "langchain-google-genai",
    "langgraph",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
